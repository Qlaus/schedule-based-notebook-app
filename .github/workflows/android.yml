name: Android build

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check no Play Services / Firebase
        run: ./gradlew checkNoGms --stacktrace

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calnotes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: calnotes-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
