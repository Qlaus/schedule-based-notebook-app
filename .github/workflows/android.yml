name: Android build

on:
  push:
    paths-ignore:
      - 'web/**'
      - '.github/workflows/web.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check no Play Services / Firebase
        run: ./gradlew checkNoGms --stacktrace

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calnotes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: calnotes-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish debug APK as "dev-latest" pre-release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          APK="NotTakvimi-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release delete dev-latest --cleanup-tag --yes || true
          gh release create dev-latest "$APK" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development build (latest)" \
            --notes "Latest debug APK from branch ${GITHUB_REF_NAME} at ${SHORT_SHA}. Download the .apk on the tablet and install it."

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
